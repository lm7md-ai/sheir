<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D082"/>
      <stop offset="50%" stop-color="#D4AF6A"/>
      <stop offset="100%" stop-color="#997028"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FA58B"/>
      <stop offset="100%" stop-color="#0F5C4D"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer manuscript ring with 8-point geometric accents -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  
  <!-- Crescent Moon Motif -->
  <path d="M 125,45 A 60,60 0 1,0 125,155 A 48,48 0 1,1 125,45 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" opacity="0.95"/>
  
  <!-- Stylized Classical Reed Pen Nib (قلم القصب) -->
  <g transform="translate(100, 100) rotate(25) translate(-100, -100)">
    <!-- Pen nib body -->
    <path d="M 88,40 L 112,40 L 114,115 L 102,152 L 100,158 L 98,152 L 86,115 Z" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <!-- Pen slit (شق القلم) -->
    <line x1="100" y1="110" x2="100" y2="158" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Pen breather hole (عين القلم) -->
    <circle cx="100" cy="108" r="3.5" fill="url(#goldGrad)"/>
    <!-- Gold nib ring collar -->
    <rect x="87" y="60" width="26" height="5" rx="1.5" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Celestial Verse Star (نجم القافية) -->
  <path d="M 132,68 L 135,76 L 143,79 L 135,82 L 132,90 L 129,82 L 121,79 L 129,76 Z" fill="url(#goldGrad)"/>
</svg>